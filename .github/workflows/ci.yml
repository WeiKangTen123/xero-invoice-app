# Runs on Node 22 — the version the VM runs and the one main/scripts/jest.setup.js
# records as the reliable one for the route suites. deploy.sh waits for this
# run to be green before it touches the server (SKIP_CI=1 to override).
name: ci
on:
  push:
    branches: [master]
  pull_request:

# The job only reads the checkout; nothing it runs should be able to push,
# comment or change a release with the token Actions hands it.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run's verdict moot, so
# it is cancelled rather than left holding a runner. deploy.sh deploys only
# origin/master's tip, so a cancelled run is for a commit it would no longer
# deploy; a deploy already waiting on that run stops, as it should.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A test that hangs (an open handle, a server never closed) otherwise holds
    # the runner for GitHub's six-hour default, and deploy.sh waits on it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Both installs below are cached; keyed on the root lockfile alone,
          # the UI's packages were downloaded afresh on every run.
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm --prefix ui ci
      - run: npm run build:ui
